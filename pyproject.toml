[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "md2docx-dissertation"
version = "0.1.0"
description = "A graph-aware Markdown to DOCX compiler"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "python-docx>=1.1", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
md2docx = "builder.cli:main"

[tool.setuptools]
packages = ["builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
