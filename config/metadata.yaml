# Структура исходников. Команда `python build.py scaffold` создаёт недостающие
# файлы, но не перезаписывает уже написанный текст в преамбулах и параграфах.
structure:
  chapters: 4
  paragraphs_per_chapter: 4
  appendices: 3
  chapter_title_template: "Глава {chapter}. Тест"
  paragraph_title_template: "{chapter}.{paragraph}. Параграф"
  preamble_title_template: "Преамбула главы {chapter}"
  conclusions_title_template: "Выводы по главе {chapter}"
