document:
  root: content/80 Abstract/Автореферат.md
  output: build/abstract-v0.docx
  assembled_markdown: build/abstract-assembled.md

numbering:
  objects: global

publications:
  hanging_indent: 7.5mm
  # Первая подходящая группа получает запись; порядок списка равен порядку групп.
  groups:
    - id: vak
      title: Публикации в изданиях, рекомендованных ВАК РФ
      keywords_any: [vak]
    - id: indexed
      title: Публикации в изданиях, индексируемых в Scopus и Web of Science
      keywords_any: [scopus, wos, web-of-science]
    - id: rights
      title: Свидетельства и патенты
      types: [software, patent]
    - id: electronic
      title: Электронные публикации
      types: [online, www, electronic]
    - id: other
      title: Публикации в других изданиях
      unmatched: true

statistics:
  # Optional authoritative PDF. If omitted, Word or LibreOffice measures the
  # final dissertation DOCX during `build`/`build-all`.
  dissertation_pdf:

validation:
  mode: draft
  public_profile: true
  placeholder_markers:
    - "[указать"
    - "_____"
    - "20__"
    - "Название диссертационной работы"
    - "Название университета"
    - "Иванов Иван Иванович"
    - "наименование структурного подразделения"
    - "Город"
    - "2000"
  # These fields intentionally remain blank for manual completion by the council.
  allowed_placeholder_fields:
    - abstract.defense.date
    - abstract.defense.time
    - abstract.defense.mailing_date
  # Private projects may list real names, organizations, titles or DOI here.
  # The public profile then refuses to build if one of these values leaks in.
  denylist: []

layout:
  page_size: A5
  margins: {left: 15mm, right: 15mm, top: 15mm, bottom: 15mm}
  font_size: 10pt
  title_font_size: 11pt
  verso_font_size: 10pt
  line_spacing: 1.0
  first_line_indent: 7.5mm
  title_spacing:
    manuscript_after: 36pt
    author_after: 54pt
    # Pandoc's Normal style contributes 12 pt of paragraph rhythm; these
    # compensated values reproduce the reference DOCX's visible 48/90 pt gaps.
    title_after: 36pt
    specialty_after: 78pt
    abstract_after: 114pt
  verso_spacing:
    organization_after: 30pt
    supervisor_after: 30pt
    opponents_after: 30pt
    opponent_entry_after: 40pt
    leading_organization_after: 72pt
    defense_after: 18pt
    access_after: 30pt
    mailing_after: 18pt

defense:
  organization: ФГБОУ ВО «Название университета»
  organization_unit: наименование структурного подразделения
  opponents:
    - degree: "канд. техн. наук, проф."
      full_name: "ИВАНОВ Иван Иванович"
    - degree: "д-р техн. наук, проф."
      full_name: "ИВАНОВ Иван Иванович"
  leading_organization: "[указать ведущую организацию]"
  date: "«_____» _____________ 20__ г."
  time: "_________"
  council: "[указать шифр диссертационного совета]"
  address: "[указать адрес защиты]"
  library: "[указать библиотеку организации]"
  website: "[указать адрес сайта]"
  mailing_date: "«_____» _____________ 20__ г"
  secretary: "[указать учёного секретаря]"
  secretary_degree: "[указать учёную степень и звание]"
