# Единый источник сокращений и математических обозначений.
# Порядок записей в YAML сохраняется в итоговом документе.
abbreviations:
  - term: ИИ
    definition: искусственный интеллект
  - term: ASR
    definition: автоматическое распознавание речи
  - term: OCR
    definition: оптическое распознавание символов

symbols:
  - term: Q
    definition: итоговая оценка качества преобразования
  - term: A
    definition: показатель качества аудиальной модальности
  - term: C
    definition: показатель полноты содержимого
